name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

# ──────────────────────────────────────────────────────────────────────────────
# Job 1: Bump version in package.json, commit, tag, push to master
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release }}
    steps:
      - name: Validate branch
        if: github.ref_name != 'master'
        run: |
          echo "::error::Releases must be created from the master branch (current: ${{ github.ref_name }})"
          exit 1

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          new_version=$(npm version ${{ inputs.bump }} --no-git-tag-version | sed 's/^v//')
          echo "release=$new_version" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$new_version" >> "$GITHUB_ENV"

      - name: Check tag does not already exist
        run: |
          if git show-ref --tags --verify --quiet "refs/tags/v${{ env.RELEASE_VERSION }}"; then
            echo "::error::Tag v${{ env.RELEASE_VERSION }} already exists"
            exit 1
          fi

      - name: Commit and tag
        run: |
          git add package.json
          git commit -m "chore(release): bump version to v${{ env.RELEASE_VERSION }}"
          git tag "v${{ env.RELEASE_VERSION }}"

      - name: Push
        run: |
          git push origin master
          git push origin "v${{ env.RELEASE_VERSION }}"

# ──────────────────────────────────────────────────────────────────────────────
# Job 2: Build ElectroBun desktop artifacts on each native platform
# ──────────────────────────────────────────────────────────────────────────────
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # arm64 (Apple Silicon)
            platform: macOS-arm64
          - os: macos-13        # x64 (Intel)
            platform: macOS-x64
          - os: windows-latest  # x64
            platform: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: v${{ needs.prepare.outputs.release_version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop app
        run: bunx electrobun build --env=stable

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1

# ──────────────────────────────────────────────────────────────────────────────
# Job 3: Assemble GitHub Release
# ──────────────────────────────────────────────────────────────────────────────
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: v${{ needs.prepare.outputs.release_version }}
          sparse-checkout: .github

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        run: |
          gh release create "v${{ needs.prepare.outputs.release_version }}" \
            artifacts/* \
            --title "Release v${{ needs.prepare.outputs.release_version }}" \
            --verify-tag \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
